[[permission]]
identifier = "workbench-commands"
description = "Allows the Workbench interface to manage its workspace, appearance, local backend, and native folder picker."
commands.allow = [
  "desktop_state",
  "create_workspace",
  "create_recommended_workspace",
  "choose_workspace",
  "choose_workspace_destination",
  "choose_workspace_parent",
  "choose_folder",
  "choose_package",
  "choose_package_folder",
  "save_dependency_export",
  "save_backend_export",
  "save_comparison_export",
  "save_visual_export",
  "move_workspace",
  "switch_workspace",
  "forget_workspace",
  "trash_workspace",
  "reveal_workspace",
  "reveal_workspace_location",
  "open_user_guide",
  "get_workspace_settings",
  "update_workspace_settings",
  "update_desktop_preferences",
  "send_workbench_notification",
  "save_runtime_profile",
  "complete_onboarding",
  "get_theme",
  "set_theme",
  "set_menu_context",
  "set_app_zoom",
  "start_docker_desktop",
  "start_backend",
  "restart_backend",
  "renderer_smoke_mode",
  "report_renderer_smoke",
  "complete_quit"
]
