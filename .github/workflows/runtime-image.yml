name: Publish ARM64 runtime 1.0.0

on:
  workflow_dispatch:
    inputs:
      approved_publication:
        description: Publish the verified unofficial ARM64 runtime
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-publication-1.0.0-arm64
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: inputs.approved_publication == true
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test source and bundled example
        run: |
          python3 -m pip install -r packaging/requirements-backend.txt
          python3 packaging/build_bundled_assets.py --check
          python3 packaging/build_user_guide.py --check
          python3 packaging/check_documentation.py
          python3 -m unittest discover -s tests
          node --check public/app.js
      - uses: docker/setup-buildx-action@v3
      - name: Resolve publication names
        id: names
        shell: bash
        working-directory: .
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visioneval-workbench-runtime" >> "$GITHUB_OUTPUT"
          echo "immutable=1.0.0-arm64-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the candidate once
        uses: docker/build-push-action@v6
        with:
          context: macos/runtime
          file: macos/runtime/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: visioneval-workbench-runtime:candidate
          build-args: |
            VISIONEVAL_REF=VE-40-RC6
            VISIONEVAL_COMMIT=f7ef3389b5626daeba6c86eeda9d172a0f8cccc2
            WORKBENCH_VERSION=1.0.0
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime and provenance
        working-directory: .
        run: |
          docker run --rm --platform linux/arm64 visioneval-workbench-runtime:candidate doctor
          docker run --rm --platform linux/arm64 visioneval-workbench-runtime:candidate verify-upstream-release
          docker run --rm --platform linux/arm64 visioneval-workbench-runtime:candidate verify-alignment-patch
          test "$(docker image inspect visioneval-workbench-runtime:candidate --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Run PlanRVA smoke model
        run: |
          mkdir -p /tmp/ve-workspace/models
          cp -R resources/examples/planrva-mm/model-template /tmp/ve-workspace/models/planrva-smoke
          docker run --rm --platform linux/arm64 -v /tmp/ve-workspace:/workspace visioneval-workbench-runtime:candidate run planrva-smoke reset
          test -d /tmp/ve-workspace/models/planrva-smoke/results/Datastore
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image
        id: publish
        working-directory: .
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.names.outputs.immutable }}
        run: |
          for tag in 1.0.0-arm64 "$IMMUTABLE_TAG"; do
            docker tag visioneval-workbench-runtime:candidate "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          DIGEST_REF="$(docker image inspect "$IMAGE:1.0.0-arm64" --format '{{ index .RepoDigests 0 }}')"
          test -n "$DIGEST_REF"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          printf '{\n  "image": "%s",\n  "tag": "1.0.0-arm64",\n  "digestReference": "%s",\n  "architecture": "linux/arm64",\n  "revision": "%s"\n}\n' "$IMAGE" "$DIGEST_REF" "$GITHUB_SHA" > runtime-publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-publication
          path: macos/runtime-publication.json
          if-no-files-found: error
