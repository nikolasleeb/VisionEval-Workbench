name: Verify prebuilt Apple Silicon macOS 2.0.0 release

# The 2.0.0 DMG was built, Developer-ID signed, notarized, and stapled on the
# release Mac. Do not rebuild or re-sign it on a GitHub runner: that would
# produce a different, unnotarized binary from the verified release artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DMG_NAME: VisionEval-Workbench-v2.0.0-macos-arm64.dmg
      DMG_SHA256: dba9c6cbe6c01917142abac912f292d84700fdb71924639967f3f58b0e190c65
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing release candidate
        run: |
          mkdir -p release-assets
          gh release download v2.0.0 --repo "${{ github.repository }}" --pattern "$DMG_NAME" --dir release-assets
      - name: Verify checksum, notarization, signature, and architecture
        run: |
          set -euo pipefail
          DMG="release-assets/$DMG_NAME"
          test "$(shasum -a 256 "$DMG" | awk '{print $1}')" = "$DMG_SHA256"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          MOUNT_ROOT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_ROOT" >/dev/null 2>&1 || true; rmdir "$MOUNT_ROOT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_ROOT" "$DMG"
          APP="$MOUNT_ROOT/VisionEval Workbench.app"
          test -d "$APP"
          test -L "$MOUNT_ROOT/Applications"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep 'Authority=Developer ID Application: Nikolas Lee-Bishop (R5T9LB7RHK)'
          codesign -dv --verbose=4 "$APP" 2>&1 | grep 'flags=.*runtime'
          APP_EXECUTABLE="$APP/Contents/MacOS/visioneval-workbench"
          SIDECAR="$(find "$APP/Contents" -type f -name 'visioneval-workbench-backend*' -print -quit)"
          test -n "$SIDECAR"
          file "$APP_EXECUTABLE" | grep arm64
          file "$SIDECAR" | grep arm64
          if file "$APP_EXECUTABLE" "$SIDECAR" | grep -q x86_64; then exit 1; fi
