name: Build Windows release 1.0.1

on:
  push:
    branches:
      - codex/windows-v1.0.1-test
  workflow_dispatch:
    inputs:
      approved_publication:
        description: Build the validated Windows 1.0.1 installer and create a draft release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: workbench-release-windows-1.0.1
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'push' || inputs.approved_publication == true
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHON: python
      WORKBENCH_DOCUMENTATION_SOURCE: docs/user
      WORKBENCH_COMPARISON_MAP_3D: enabled
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Windows release identity
        shell: pwsh
        run: |
          $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $documentationVersion = (Get-Content docs/user/documentation.json -Raw | ConvertFrom-Json).documentationVersion
          if ($tauriVersion -ne "1.0.1") { throw "Expected Tauri version 1.0.1, found $tauriVersion" }
          if ($packageVersion -ne "1.0.1") { throw "Expected package version 1.0.1, found $packageVersion" }
          if ($documentationVersion -ne "1.0.1-windows") { throw "Expected Windows documentation 1.0.1-windows, found $documentationVersion" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: windows/packaging/requirements-backend.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: windows/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r packaging/requirements-backend.txt
      - run: npm ci
        working-directory: windows/desktop
      - name: Validate Windows source
        shell: pwsh
        run: |
          python packaging/build_bundled_assets.py --check
          python packaging/build_user_guide.py --check
          python packaging/build_windows_icon.py --check
          python packaging/check_documentation.py
          python packaging/check_renderer_assets.py
          python -m unittest discover -s tests
          node --check public/app.js
          node tests/polygon-labels.test.js
          node tests/extrusion-borders.test.js
          cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build and test enabled backend
        shell: pwsh
        run: |
          python packaging/build_backend.py --comparison-map-3d enabled --documentation-source docs/user
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build frozen renderer candidate
        run: npm run tauri:build -- --no-bundle
        working-directory: windows/desktop
      - name: Run frozen WebView2 smoke gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $PWD "build/renderer-smoke"
          $workspace = Join-Path $smokeRoot "workspace"
          $report = Join-Path $smokeRoot "report.json"
          New-Item -ItemType Directory -Force $workspace | Out-Null
          $env:WORKBENCH_RENDERER_SMOKE = "1"
          $env:WORKBENCH_RENDERER_SMOKE_REPORT = $report
          $env:WORKBENCH_SMOKE_WORKSPACE = $workspace
          $candidate = Join-Path $PWD "desktop/src-tauri/target/release/visioneval-workbench.exe"
          $process = Start-Process -FilePath $candidate -PassThru -WindowStyle Hidden
          $timedOut = $false
          try { Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop } catch { $timedOut = $true; Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if ($timedOut -or -not (Test-Path $report) -or -not ((Get-Content $report -Raw | ConvertFrom-Json).success)) {
            throw "The frozen WebView2 smoke gate did not pass"
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          python packaging/build_backend.py --comparison-map-3d enabled --documentation-source docs/user
          Push-Location desktop
          try { npm run tauri:build -- --bundles nsis } finally { Pop-Location }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $source = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $source) { throw "NSIS installer was not produced" }
          Copy-Item $source.FullName release-assets/VisionEval-Workbench-v1.0.1-windows-x64-setup.exe
      - name: Package exact Windows source
        shell: pwsh
        run: |
          git archive --format=zip --prefix=VisionEval-Workbench-v1.0.1-windows-source/ --output=release-assets/VisionEval-Workbench-v1.0.1-windows-source.zip HEAD:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-1.0.1-release
          path: |
            windows/release-assets/VisionEval-Workbench-v1.0.1-windows-x64-setup.exe
            windows/release-assets/VisionEval-Workbench-v1.0.1-windows-source.zip
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.approved_publication == true
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-1.0.1-release
          path: release-assets
      - name: Verify immutable release target
        run: |
          test -f release-assets/VisionEval-Workbench-v1.0.1-windows-x64-setup.exe
          test -f release-assets/VisionEval-Workbench-v1.0.1-windows-source.zip
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 already exists; refusing to replace it" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: VisionEval Workbench 1.0.1 for Windows
          body_path: windows/docs/release-notes-v1.0.1.md
          draft: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*
