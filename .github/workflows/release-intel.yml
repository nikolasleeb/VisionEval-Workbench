name: Add Intel macOS assets to release 1.0.0 --clobber
    continue-on-error: true

on:
  workflow_dispatch:
    inputs:
      approved_publication:
        description: Build verified Intel assets and add them to the public v1.0.0 release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: workbench-release-1.0.0-intel
  cancel-in-progress: false

jobs:
  intel:
    if: inputs.approved_publication == true
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intel/packaging/requirements-backend.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: intel/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: python3 -m pip install -r packaging/requirements-backend.txt
      - run: npm ci
        working-directory: intel/desktop
      - name: Validate pinned Intel source
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(uname -m)" = "x86_64"
          test "$(python3 -c 'import json; print(json.load(open("docs/user-intel/documentation.json"))["documentationVersion"])')" = "1.0.0-macos-intel"
          python3 packaging/update_runtime_publication.py --check
          python3 packaging/build_bundled_assets.py --check
          python3 packaging/build_user_guide.py --check
          python3 packaging/check_documentation.py
          python3 packaging/check_renderer_assets.py
          python3 -m unittest discover -s tests
          node --check public/app.js
          node tests/polygon-labels.test.js
          node tests/extrusion-borders.test.js
          python3 packaging/build_backend.py --comparison-map-3d enabled --documentation-source docs/user-intel
          cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-apple-darwin
      - name: Build x86_64 application
        env:
          WORKBENCH_DOCUMENTATION_SOURCE: docs/user-intel
          WORKBENCH_COMPARISON_MAP_3D: enabled
        run: npm run tauri:build -- --target x86_64-apple-darwin --bundles app
        working-directory: intel/desktop
      - name: Verify, sign, and package Intel DMG
        run: |
          mkdir -p release-assets
          SOURCE_APP="$(find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name 'VisionEval Workbench.app' -type d -print -quit)"
          test -n "$SOURCE_APP"
          APP_EXECUTABLE="$SOURCE_APP/Contents/MacOS/visioneval-workbench"
          SIDECAR="$(find "$SOURCE_APP/Contents" -type f -name 'visioneval-workbench-backend*' -print -quit)"
          test -n "$SIDECAR"
          file "$APP_EXECUTABLE" | grep x86_64
          file "$SIDECAR" | grep x86_64
          if file "$APP_EXECUTABLE" "$SIDECAR" | grep -q arm64; then exit 1; fi
          codesign --force --deep --sign - "$SOURCE_APP"
          codesign --verify --deep --strict --verbose=2 "$SOURCE_APP"
          DMG_ROOT="$(mktemp -d)"
          ditto "$SOURCE_APP" "$DMG_ROOT/VisionEval Workbench.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "VisionEval Workbench 1.0.0 Intel" -srcfolder "$DMG_ROOT" -ov -format UDZO release-assets/VisionEval-Workbench-v1.0.0-macos-x64.dmg
          MOUNT_ROOT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_ROOT" release-assets/VisionEval-Workbench-v1.0.0-macos-x64.dmg
          test -d "$MOUNT_ROOT/VisionEval Workbench.app"
          test -L "$MOUNT_ROOT/Applications"
          codesign --verify --deep --strict "$MOUNT_ROOT/VisionEval Workbench.app"
          file "$MOUNT_ROOT/VisionEval Workbench.app/Contents/MacOS/visioneval-workbench" | grep x86_64
          hdiutil detach "$MOUNT_ROOT"
      - name: Package exact Intel source snapshot
        run: |
          mkdir -p staging/VisionEval-Workbench-v1.0.0-intel-source
          rsync -a --exclude node_modules --exclude target --exclude build --exclude dist --exclude release-assets --exclude staging --exclude __pycache__ --exclude '*.pyc' --exclude .DS_Store ./ staging/VisionEval-Workbench-v1.0.0-intel-source/
          ditto -c -k --keepParent staging/VisionEval-Workbench-v1.0.0-intel-source release-assets/VisionEval-Workbench-v1.0.0-intel-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: intel-release
          path: |
            intel/release-assets/VisionEval-Workbench-v1.0.0-macos-x64.dmg
            intel/release-assets/VisionEval-Workbench-v1.0.0-intel-source.zip
          if-no-files-found: error

  attach-to-release:
    if: inputs.approved_publication == true
    needs: intel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: intel-release
          path: release-assets
      - name: Verify additive release assets
        run: |
          test -f release-assets/VisionEval-Workbench-v1.0.0-macos-x64.dmg
          test -f release-assets/VisionEval-Workbench-v1.0.0-intel-source.zip
          git ls-remote --exit-code --tags origin refs/tags/v1.0.0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-assets/*


  upload-assets:
    if: inputs.approved_publication == true
    needs: intel
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intel-release
          path: release-assets
      - name: Upload Intel assets without replacing existing release files
        run: gh release upload v1.0.0 release-assets/* --repo ${{ github.repository }}
