name: Publish Intel AMD64 runtime 1.0.0

on:
  workflow_dispatch:
    inputs:
      approved_publication:
        description: Publish and pin the verified unofficial AMD64 runtime
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: runtime-publication-1.0.0-amd64
  cancel-in-progress: false

jobs:
  build-test-publish-and-pin:
    if: inputs.approved_publication == true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v3
      - name: Resolve publication names
        id: names
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visioneval-workbench-runtime" >> "$GITHUB_OUTPUT"
          echo "immutable=1.0.0-amd64-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the AMD64 candidate once
        uses: docker/build-push-action@v6
        with:
          context: intel/runtime
          file: intel/runtime/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: visioneval-workbench-runtime:intel-candidate
          build-args: |
            VISIONEVAL_REF=VE-40-RC6
            VISIONEVAL_COMMIT=f7ef3389b5626daeba6c86eeda9d172a0f8cccc2
            WORKBENCH_VERSION=1.0.0
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime, provenance, architecture, and PlanRVA model
        run: |
          test "$(docker image inspect visioneval-workbench-runtime:intel-candidate --format '{{ index .Config.Labels "org.opencontainers.image.architecture" }}')" = "amd64"
          test "$(docker image inspect visioneval-workbench-runtime:intel-candidate --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker run --rm --platform linux/amd64 visioneval-workbench-runtime:intel-candidate doctor
          docker run --rm --platform linux/amd64 visioneval-workbench-runtime:intel-candidate verify-upstream-release
          docker run --rm --platform linux/amd64 visioneval-workbench-runtime:intel-candidate verify-alignment-patch
          mkdir -p /tmp/ve-workspace/models
          cp -R intel/resources/examples/planrva-mm/model-template /tmp/ve-workspace/models/planrva-smoke
          docker run --rm --platform linux/amd64 -v /tmp/ve-workspace:/workspace visioneval-workbench-runtime:intel-candidate run planrva-smoke reset
          test -d /tmp/ve-workspace/models/planrva-smoke/results/Datastore
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image and capture registry digest
        id: publish
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.names.outputs.immutable }}
        run: |
          for tag in 1.0.0-amd64 "$IMMUTABLE_TAG"; do
            docker tag visioneval-workbench-runtime:intel-candidate "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          DIGEST_REF="$(docker image inspect "$IMAGE:1.0.0-amd64" --format '{{ index .RepoDigests 0 }}')"
          DIGEST="${DIGEST_REF##*@}"
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '{\n  "image": "%s",\n  "tag": "1.0.0-amd64",\n  "immutableTag": "%s",\n  "digestReference": "%s@%s",\n  "architecture": "linux/amd64",\n  "revision": "%s"\n}\n' "$IMAGE" "$IMMUTABLE_TAG" "$IMAGE" "$DIGEST" "$GITHUB_SHA" > intel/runtime-publication-amd64.json
      - name: Pin the published digest in Intel source
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python3 intel/packaging/update_runtime_publication.py --digest "$DIGEST" --revision "$GITHUB_SHA"
          python3 intel/packaging/build_bundled_assets.py
          python3 intel/packaging/build_user_guide.py
          python3 intel/packaging/update_runtime_publication.py --check
          python3 intel/packaging/build_bundled_assets.py --check
          python3 intel/packaging/build_user_guide.py --check
          python3 intel/packaging/check_documentation.py
      - name: Commit immutable runtime identity
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add intel
          git commit -m "Pin Intel AMD64 runtime ${DIGEST}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: intel-runtime-publication
          path: intel/runtime-publication-amd64.json
          if-no-files-found: error

