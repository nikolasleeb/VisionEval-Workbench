<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">VisionEval Workbench workflow</title>
  <desc id="desc">Four connected steps: Explore inputs, Create scenarios, Run VisionEval, and Compare observed changes.</desc>
  <rect width="780" height="460" rx="22" fill="#f4f7fb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(38 38)">
      <rect width="290" height="150" rx="16" fill="#e8f2ff" stroke="#2271c9" stroke-width="3"/>
      <text x="22" y="40" font-size="17" fill="#2271c9" font-weight="700">1 · EXPLORE</text>
      <text x="22" y="76" font-size="26" fill="#142235" font-weight="700">Understand inputs</text>
      <text x="22" y="111" font-size="16" fill="#51647b">Definitions, units, and</text>
      <text x="22" y="134" font-size="16" fill="#51647b">dependency paths</text>
    </g>
    <g transform="translate(452 38)">
      <rect width="290" height="150" rx="16" fill="#eef8f0" stroke="#2f8b57" stroke-width="3"/>
      <text x="22" y="40" font-size="17" fill="#2f8b57" font-weight="700">2 · CREATE</text>
      <text x="22" y="76" font-size="26" fill="#142235" font-weight="700">Edit scenarios</text>
      <text x="22" y="111" font-size="16" fill="#51647b">Preview, review, and save</text>
      <text x="22" y="134" font-size="16" fill="#51647b">individual or batch changes</text>
    </g>
    <g transform="translate(38 272)">
      <rect width="290" height="150" rx="16" fill="#fff4e8" stroke="#b96b22" stroke-width="3"/>
      <text x="22" y="40" font-size="17" fill="#b96b22" font-weight="700">3 · RUN</text>
      <text x="22" y="76" font-size="26" fill="#142235" font-weight="700">Execute runs</text>
      <text x="22" y="111" font-size="16" fill="#51647b">Use the global queue, live</text>
      <text x="22" y="134" font-size="16" fill="#51647b">logs, and verified results</text>
    </g>
    <g transform="translate(452 272)">
      <rect width="290" height="150" rx="16" fill="#f7edf7" stroke="#8e4b8c" stroke-width="3"/>
      <text x="22" y="40" font-size="17" fill="#8e4b8c" font-weight="700">4 · COMPARE</text>
      <text x="22" y="76" font-size="26" fill="#142235" font-weight="700">Observe changes</text>
      <text x="22" y="111" font-size="16" fill="#51647b">Filter, map, scan, chart,</text>
      <text x="22" y="134" font-size="16" fill="#51647b">summarize, and export</text>
    </g>
    <g fill="#627b98">
      <path d="M352 98h72l-15-15 9-9 31 31-31 31-9-9 15-15h-72z"/>
      <path d="M176 210h30v34h-14v-20h-16z"/>
      <path d="M192 244l-15-15 9-9 31 31-31 31-9-9 15-15z"/>
      <path d="M352 332h72l-15-15 9-9 31 31-31 31-9-9 15-15h-72z"/>
    </g>
  </g>
</svg>
